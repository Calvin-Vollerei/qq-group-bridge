name: CI

# 全部离线运行：不接触真实 QQ / 网盘账号，也不需要任何密钥。
# 依赖只有 requests / segno / Pillow，几条 pip 装完即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 离线端到端冒烟（无账号、无网络）
        run: python -m qgb.dev.smoke

      - name: 源码扫密（发布前闸门）
        run: python scripts/scan_secrets.py --source

  package-check:
    name: 分发包闸门（仅 Windows / 3.11）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: GUI 结构检查（无需显示器）
        run: python scripts/gui_inspect.py
      - name: 校验打包脚本与排除规则
        run: python -m unittest tests.test_make_release_zip -v
